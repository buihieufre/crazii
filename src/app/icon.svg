<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tw_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C212D"/>
      <stop offset="100%" stop-color="#0E1118"/>
    </linearGradient>
    <linearGradient id="tw_line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B7C98"/>
      <stop offset="45%" stop-color="#CBB193"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="tw_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tw_bg)" stroke="#CBB193" stroke-width="2.5" stroke-opacity="0.8"/>
  
  <!-- Candle Grid Subtle Background -->
  <line x1="18" y1="14" x2="18" y2="50" stroke="#6B7C98" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="32" y1="14" x2="32" y2="50" stroke="#6B7C98" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="46" y1="14" x2="46" y2="50" stroke="#6B7C98" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#6B7C98" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Glowing Breakout Trendline 'W' Pattern -->
  <path d="M14 36 L23 45 L31 27 L39 37 L49 17" stroke="url(#tw_line)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#tw_glow)"/>

  <!-- Peak Breakout Signal Dot -->
  <circle cx="49" cy="17" r="4" fill="#FFFFFF" filter="url(#tw_glow)"/>
  <circle cx="49" cy="17" r="2.2" fill="#CBB193"/>
</svg>
